name: Publish Docker image

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: anuarsantoyo/on-your-shoes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # Waits for the image to be built and pushed
    permissions:
      contents: read
      id-token: write # Required for keyless auth to Google Cloud

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'on-your-shoes' # Your Cloud Run service name
          region: 'europe-west1'
          # This is the magic: it uses the exact image that was just built
          image: 'ghcr.io/anuarsantoyo/on-your-shoes@${{ needs.build-and-push.outputs.digest }}'
          env_vars: |
            APP_ENV=prod
            LOG_LEVEL=INFO
          secrets: |
            OPENAI_API_KEY=OPENAI_API_KEY:latest
