<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On Your Shoes — graph (debug)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { height:100%; margin:0; background:#0e0f12; color:#e8e6e3; font-family: ui-monospace, Menlo, monospace; }
  body { display:flex; flex-direction:column; padding:0 20px 20px; box-sizing:border-box; }
  h1 { font-size:16px; font-weight:normal; margin:14px 0 4px; }
  .legend span { margin-right:14px; font-size:12px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; }
  .legend i.bar { width:16px; height:2px; border-radius:0; vertical-align:middle; }
  #info { font-size:12px; margin:8px 0; min-height:60px; color:#8a8f98; line-height:1.6; }
  #info .out { color:#e0a860; }
  #info .in  { color:#5aa0d0; }
  #info .id  { color:#5c6169; }
  #map { flex:1; min-height:0; background:#0e0f12; border-radius:6px; }
  .nlabel {
    background:transparent !important; border:none !important; box-shadow:none !important;
    color:#e8e6e3 !important; font-size:9px !important; font-family:ui-monospace,Menlo,monospace !important;
    text-shadow:0 0 3px #000, 0 0 3px #000;
  }
</style>
</head>
<body>
<h1>On Your Shoes — full graph (geographic, debug view)</h1>
<p class="legend">
  <span><i style="background:#c9a06a"></i>origin</span>
  <span><i style="background:#7d8ca3"></i>transit</span>
  <span><i style="background:#6ba3c9"></i>arrival</span>
  <span><i style="background:#c96a6a"></i>border</span>
  <span><i style="background:#b06ac9"></i>detention</span>
  <span><i style="background:#4a9bc9"></i>sea crossing</span>
  <span><i style="background:#6ac98a"></i>terminal</span>
  <span style="margin-left:8px">— hover a node:</span>
  <span><i class="bar" style="background:#e0a860"></i>outgoing</span>
  <span><i class="bar" style="background:#5aa0d0"></i>incoming</span>
  <span><i class="bar" style="background:#c97ac9"></i>self-loop</span>
</p>
<div id="info">Hover a node to see its connections.</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORS = { origin:'#c9a06a', transit:'#7d8ca3', arrival:'#6ba3c9', border:'#c96a6a',
                 detention:'#b06ac9', camp:'#c9a06a', sea_crossing:'#4a9bc9', terminal:'#6ac98a' };
const EDGE_GRAY = '#8a8f98';

fetch('/graph').then(r => r.json()).then(g => {
  const nodes = g.nodes, edges = g.edges;
  const idx = {}; nodes.forEach((n,i) => idx[n.id] = i);
  const placeOf = id => (idx[id] !== undefined) ? nodes[idx[id]].place : id;

  // precompute connections (outgoing + incoming) per node
  const conn = {}; nodes.forEach(n => conn[n.id] = { out: [], in: [] });
  edges.forEach(e => { conn[e.from_node].out.push(e); conn[e.to_node].in.push(e); });

  const map = L.map('map', { zoomControl: true, attributionControl: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  const coord = id => [nodes[idx[id]].lat, nodes[idx[id]].lon];

  // edges (polylines); a self-loop becomes a ring around its node
  const edgeLayers = [];
  edges.forEach(e => {
    if (e.from_node === e.to_node) {
      const layer = L.circleMarker(coord(e.from_node), { radius: 12, weight: 1.5, color: EDGE_GRAY, fill: false });
      layer.addTo(map);
      edgeLayers.push({ from: e.from_node, to: e.to_node, layer, self: true });
    } else {
      const layer = L.polyline([coord(e.from_node), coord(e.to_node)], { color: EDGE_GRAY, weight: 1.5, opacity: 1 });
      layer.addTo(map);
      edgeLayers.push({ from: e.from_node, to: e.to_node, layer, self: false });
    }
  });

  // nodes (circle markers with permanent tiny labels)
  const nodeMarkers = {};
  nodes.forEach(n => {
    const m = L.circleMarker([n.lat, n.lon], {
      radius: 6, weight: 1, color: '#0e0f12',
      fillColor: COLORS[n.role] || '#888', fillOpacity: 1,
    });
    m.bindTooltip(n.place, { permanent: true, direction: 'top', offset: [0, -8], className: 'nlabel' });
    m.on('mouseover', () => hover(n.id));
    m.on('mouseout', reset);
    m.addTo(map);
    nodeMarkers[n.id] = m;
  });

  const info = document.getElementById('info');

  function hover(id) {
    const c = conn[id];
    edgeLayers.forEach(e => {
      if (e.self && e.from === id) e.layer.setStyle({ color: '#c97ac9', weight: 3, opacity: 1 });
      else if (e.from === id) e.layer.setStyle({ color: '#e0a860', weight: 3, opacity: 1 });
      else if (e.to === id) e.layer.setStyle({ color: '#5aa0d0', weight: 3, opacity: 1 });
      else e.layer.setStyle({ color: EDGE_GRAY, weight: 1.5, opacity: 0.08 });
    });
    const neighbors = new Set();
    c.out.forEach(e => neighbors.add(e.to_node));
    c.in.forEach(e => neighbors.add(e.from_node));
    Object.entries(nodeMarkers).forEach(([nid, m]) => {
      if (nid === id) m.setStyle({ weight: 3, color: '#ffffff', radius: 9 });
      else if (neighbors.has(nid)) m.setStyle({ weight: 2, color: '#ffffff' });
      else m.setStyle({ weight: 1, color: '#0e0f12', fillOpacity: 0.15 });
    });
    const out = c.out.map(e => `${e.action_type} → ${placeOf(e.to_node)}`);
    const inn = c.in.map(e => `${placeOf(e.from_node)} (${e.action_type})`);
    info.innerHTML =
      `<b>${placeOf(id)}</b> <span class="id">${id}</span>` +
      `<br><span class="out">outgoing (${c.out.length})</span>: ${out.join('; ') || '—'}` +
      `<br><span class="in">incoming (${c.in.length})</span>: ${inn.join('; ') || '—'}`;
  }

  function reset() {
    edgeLayers.forEach(e => e.layer.setStyle({ color: EDGE_GRAY, weight: 1.5, opacity: 1 }));
    Object.values(nodeMarkers).forEach(m => m.setStyle({ weight: 1, color: '#0e0f12', fillOpacity: 1 }));
    info.innerHTML = 'Hover a node to see its connections.';
  }

  map.fitBounds(L.latLngBounds(nodes.map(n => [n.lat, n.lon])).pad(0.1));
});
</script>
</body>
</html>
