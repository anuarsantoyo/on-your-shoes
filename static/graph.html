<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On Your Shoes — graph (debug)</title>
<style>
  body { margin:0; background:#0e0f12; color:#e8e6e3; font-family: ui-monospace, Menlo, monospace; padding:20px; }
  h1 { font-size:16px; font-weight:normal; margin-bottom:4px; }
  .legend span { margin-right:16px; font-size:12px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; }
  .legend i.bar { width:16px; height:2px; border-radius:0; vertical-align:middle; }
  #info { font-size:12px; margin:12px 0; min-height:18px; color:#8a8f98; line-height:1.6; }
  #info .out { color:#e0a860; }
  #info .in  { color:#5aa0d0; }
  #info .id  { color:#5c6169; }
  #wrap { overflow-x:auto; }

  .edge { stroke:#3a404a; transition: stroke .15s ease, opacity .15s ease, stroke-width .15s ease; }
  .edge.dim  { opacity:.08; }
  .edge.out  { stroke:#e0a860; stroke-width:2.4; opacity:1; }
  .edge.in   { stroke:#5aa0d0; stroke-width:2.4; opacity:1; }
  .edge.self { stroke:#c97ac9; stroke-width:2.4; opacity:1; }

  circle.node { transition: opacity .15s ease; }
  circle.node.dim      { opacity:.12; }
  circle.node.neighbor { stroke:#ffffff; stroke-width:1.6; }
  circle.node.hovered  { stroke:#ffffff; stroke-width:3; }
</style>
</head>
<body>
<h1>On Your Shoes — full graph (top-to-bottom, debug view)</h1>
<p class="legend">
  <span><i style="background:#c9a06a"></i>origin</span>
  <span><i style="background:#7d8ca3"></i>transit</span>
  <span><i style="background:#6ba3c9"></i>arrival</span>
  <span><i style="background:#c96a6a"></i>border</span>
  <span><i style="background:#b06ac9"></i>detention</span>
  <span><i style="background:#4a9bc9"></i>sea crossing</span>
  <span><i style="background:#6ac98a"></i>terminal</span>
  <span style="margin-left:8px">— hover a node:</span>
  <span><i class="bar" style="background:#e0a860"></i>outgoing</span>
  <span><i class="bar" style="background:#5aa0d0"></i>incoming</span>
  <span><i class="bar" style="background:#c97ac9"></i>self-loop</span>
</p>
<div id="info">Hover a node to see its connections.</div>
<div id="wrap"><div id="graph"></div></div>
<script>
const COLORS = { origin:'#c9a06a', transit:'#7d8ca3', arrival:'#6ba3c9', border:'#c96a6a',
                 detention:'#b06ac9', camp:'#c9a06a', sea_crossing:'#4a9bc9', terminal:'#6ac98a' };

function layout(nodes, edges) {
  const N = nodes.length;
  const idx = {}; nodes.forEach((n,i) => idx[n.id] = i);
  const nonSelf = edges.filter(e => e.from_node !== e.to_node);
  const adj = Array.from({length:N}, () => []);
  nonSelf.forEach(e => adj[idx[e.from_node]].push(idx[e.to_node]));

  // DFS back-edge detection (break cycles for a clean top-to-bottom flow)
  const color = new Array(N).fill(0);
  const back = new Set();
  function dfs(u) {
    color[u] = 1;
    for (const v of adj[u]) {
      if (color[v] === 1) back.add(u + ',' + v);
      else if (color[v] === 0) dfs(v);
    }
    color[u] = 2;
  }
  for (let i = 0; i < N; i++) if (color[i] === 0) dfs(i);

  // DAG adjacency (skip self-loops and cycle-closing back edges)
  const dag = Array.from({length:N}, () => []);
  const indeg = new Array(N).fill(0);
  nonSelf.forEach(e => {
    const u = idx[e.from_node], v = idx[e.to_node];
    if (back.has(u + ',' + v)) return;
    dag[u].push(v); indeg[v]++;
  });

  // Kahn topological order; leftover (cycle) nodes appended
  const q = []; for (let i = 0; i < N; i++) if (indeg[i] === 0) q.push(i);
  const order = [];
  while (q.length) { const u = q.shift(); order.push(u); for (const v of dag[u]) if (--indeg[v] === 0) q.push(v); }
  const seen = new Set(order);
  for (let i = 0; i < N; i++) if (!seen.has(i)) order.push(i);

  // longest-path rank (layer = deepest position in the flow)
  const rank = new Array(N).fill(0);
  order.forEach(u => dag[u].forEach(v => { rank[v] = Math.max(rank[v], rank[u] + 1); }));

  const layers = {};
  nodes.forEach((n, i) => { const r = rank[i]; (layers[r] = layers[r] || []).push(i); });
  const maxRank = Math.max(...rank);
  const layerMax = Math.max(...Object.values(layers).map(l => l.length));

  const vGap = 100, hGap = 150, padX = 150, padY = 60;
  const W = padX * 2 + (layerMax - 1) * hGap;
  const H = padY * 2 + maxRank * vGap;
  const pos = nodes.map(() => [0, 0]);
  Object.entries(layers).forEach(([r, layer]) => {
    const y = padY + (+r) * vGap;
    layer.forEach((i, j) => {
      const x = padX + j * hGap + (layerMax - layer.length) * hGap / 2;
      pos[i] = [x, y];
    });
  });
  return { pos, W, H };
}

fetch('/graph').then(r => r.json()).then(g => {
  const nodes = g.nodes, edges = g.edges;
  const idx = {}; nodes.forEach((n,i) => idx[n.id] = i);
  const placeOf = id => { const n = nodes[idx[id]]; return n ? n.place : id; };

  // precompute connections (outgoing + incoming) per node
  const conn = {}; nodes.forEach(n => conn[n.id] = { out: [], in: [] });
  edges.forEach(e => { conn[e.from_node].out.push(e); conn[e.to_node].in.push(e); });

  const { pos, W, H } = layout(nodes, edges);

  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  svg += '<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3a404a"/></marker></defs>';

  edges.forEach(e => {
    const [x1, y1] = pos[idx[e.from_node]], [x2, y2] = pos[idx[e.to_node]];
    if (e.from_node === e.to_node) {
      svg += `<circle class="edge" data-from="${e.from_node}" data-to="${e.to_node}" cx="${x1 + 12}" cy="${y1 - 12}" r="8" fill="none" stroke="#3a404a" stroke-width="1"/>`;
    } else {
      svg += `<line class="edge" data-from="${e.from_node}" data-to="${e.to_node}" x1="${x1}" y1="${y1 + 10}" x2="${x2}" y2="${y2 - 10}" stroke="#3a404a" stroke-width="1" marker-end="url(#arrow)"/>`;
    }
  });

  nodes.forEach((n, i) => {
    const [x, y] = pos[i];
    svg += `<circle class="node" data-id="${n.id}" cx="${x}" cy="${y}" r="7" fill="${COLORS[n.role] || '#888'}"/>`;
    svg += `<circle class="node-hit" data-id="${n.id}" cx="${x}" cy="${y}" r="15" fill="transparent"/>`;
    svg += `<text x="${x}" y="${y - 13}" fill="#cfd3da" font-size="10" text-anchor="middle">${n.place}</text>`;
    if (n.role === 'origin' || n.role === 'terminal') {
      svg += `<text x="${x}" y="${y + 23}" fill="#8a8f98" font-size="9" text-anchor="middle">${n.role}</text>`;
    }
  });
  svg += '</svg>';
  document.getElementById('graph').innerHTML = svg;

  // hover behaviour
  const edgeEls = [...document.querySelectorAll('.edge')];
  const nodeEls = [...document.querySelectorAll('.node')];
  const hitEls  = [...document.querySelectorAll('.node-hit')];
  const nodeElById = {}; nodeEls.forEach(el => nodeElById[el.dataset.id] = el);
  const info = document.getElementById('info');

  function reset() {
    edgeEls.forEach(e => e.classList.remove('out', 'in', 'self', 'dim'));
    nodeEls.forEach(n => n.classList.remove('neighbor', 'dim', 'hovered'));
    info.innerHTML = 'Hover a node to see its connections.';
  }

  hitEls.forEach(hit => {
    const id = hit.dataset.id;
    hit.addEventListener('mouseenter', () => {
      const c = conn[id];
      // edges: color by direction relative to this node
      edgeEls.forEach(e => {
        const f = e.dataset.from, t = e.dataset.to;
        e.classList.remove('out', 'in', 'self', 'dim');
        if (f === id && t === id) e.classList.add('self');
        else if (f === id) e.classList.add('out');
        else if (t === id) e.classList.add('in');
        else e.classList.add('dim');
      });
      // nodes: ring the neighbours, dim the rest
      const neighbors = new Set();
      c.out.forEach(e => neighbors.add(e.to_node));
      c.in.forEach(e => neighbors.add(e.from_node));
      nodeEls.forEach(n => {
        const nid = n.dataset.id;
        n.classList.remove('neighbor', 'dim', 'hovered');
        if (nid === id) n.classList.add('hovered');
        else if (neighbors.has(nid)) n.classList.add('neighbor');
        else n.classList.add('dim');
      });
      // info panel
      const out = c.out.map(e => `${e.action_type} → ${placeOf(e.to_node)}`);
      const inn = c.in.map(e => `${placeOf(e.from_node)} (${e.action_type})`);
      info.innerHTML =
        `<b>${placeOf(id)}</b> <span class="id">${id}</span>` +
        `<br><span class="out">outgoing (${c.out.length})</span>: ${out.join('; ') || '—'}` +
        `<br><span class="in">incoming (${c.in.length})</span>: ${inn.join('; ') || '—'}`;
    });
    hit.addEventListener('mouseleave', reset);
  });
});
</script>
</body>
</html>
